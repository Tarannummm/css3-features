<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transform and translate</title>
    <style>
        body{
            margin-left: 50px;
        }
        .container{
            border: 2px solid orchid;
            width: 300px;
            height: 300px;
            margin-bottom: 10px;
            background-color: blanchedalmond;

        }
        .inner{
            border: 1px dotted fuchsia;
            text-align: center;
            align-items: center;
            width: 200px;
            height: 200px;
            background-color: burlywood;
              transform: scale(0.25, 0.5); 
            transform: rotate(-45deg); 
             transform: scale(0.5) translateX(100px) translateY(-150px) rotate(45deg);     
             transform: scale(0.5) rotate(45deg) translateX(100px); 
        }
        .inner:hover{
            transform: translateY(-50px) scale(0.5) rotate(45deg);
        }
        
    </style>
</head>
<body>
    <h2>Explore transfrom and translate</h2>
    <div class="container">
        <div class="inner">Inner 1</div>
    </div>
    <div class="container">
        <div class="inner">Inner 2</div>
    </div>
    <div class="container">
        <div class="inner">Inner 3</div>
    </div>
</body>
</html>
